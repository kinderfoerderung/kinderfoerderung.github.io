<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinderförderung</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="app">

  <header class="hero">
    <div class="logo-wrap">
      <img src="logo.png" alt="Kinderförderung Logo" class="app-logo" />
    </div>
    <p class="hero-subline">5 Minuten · Alltagsmaterial · Ohne Bildschirm</p>
  </header>

 <h2>Alter des Kindes</h2>

<div class="age-grid">

  <button class="age-card" data-age="1-2">
    <img src="age1.png" alt="">
    <span>1–2</span>
  </button>

  <button class="age-card" data-age="3-4">
    <img src="age2.png" alt="">
    <span>3–4</span>
  </button>

  <button class="age-card" data-age="5-6">
    <img src="age3.png" alt="">
    <span>5–6</span>
  </button>

  <button class="age-card" data-age="7+">
    <img src="age4.png" alt="">
    <span>7+</span>
  </button>

</div>

  <h2>Material wählen</h2>

<div class="material-select">

  <div class="material-trigger" id="material-trigger">
    Auswählen
  </div>

 <label><input type="checkbox" data-material="none" checked> Nichts</label>

<label><input type="checkbox" data-material="papier"> Papier</label>
<label><input type="checkbox" data-material="karton"> Bunter Karton</label>
<label><input type="checkbox" data-material="stifte"> Stifte / Buntstifte / Filzstifte</label>
<label><input type="checkbox" data-material="wasser"> Wasser</label>
<label><input type="checkbox" data-material="becher"> Becher / Plastikbecher</label>
<label><input type="checkbox" data-material="schuessel"> Schüssel</label>
<label><input type="checkbox" data-material="tuch"> Tuch</label>
<label><input type="checkbox" data-material="socken"> Socken</label>
<label><input type="checkbox" data-material="kissen"> Kissen</label>
<label><input type="checkbox" data-material="kartons"> Karton / Kartons</label>

<label><input type="checkbox" data-material="spielzeug"> Spielzeug</label>
<label><input type="checkbox" data-material="kleinspielzeug"> Kleine Spielzeuge</label>
<label><input type="checkbox" data-material="autos"> Spielzeugautos</label>
<label><input type="checkbox" data-material="bausteine"> Bausteine</label>
<label><input type="checkbox" data-material="buecher"> Buch / Bücher</label>

<label><input type="checkbox" data-material="papproehren"> Pappröhren</label>
<label><input type="checkbox" data-material="rollen"> Papierrollen / Klopapierrollen</label>
<label><input type="checkbox" data-material="deckel"> Deckel</label>
<label><input type="checkbox" data-material="loeffel"> Löffel</label>
<label><input type="checkbox" data-material="kelle"> Suppenkelle</label>

<label><input type="checkbox" data-material="klebeband"> Klebeband / Malerkrepp</label>
<label><input type="checkbox" data-material="schere"> Schere</label>
<label><input type="checkbox" data-material="kleber"> Kleber</label>
<label><input type="checkbox" data-material="farben"> Farben / Fingerfarben</label>
<label><input type="checkbox" data-material="pinsel"> Pinsel</label>
<label><input type="checkbox" data-material="sticker"> Sticker</label>

<label><input type="checkbox" data-material="watte"> Watte</label>
<label><input type="checkbox" data-material="wattestaebchen"> Wattestäbchen</label>
<label><input type="checkbox" data-material="waescheklammern"> Wäscheklammern</label>
<label><input type="checkbox" data-material="pompons"> Pompons</label>
<label><input type="checkbox" data-material="federn"> Federn</label>
<label><input type="checkbox" data-material="pinzette"> Pinzette</label>
<label><input type="checkbox" data-material="gummibaender"> Gummibänder</label>

<label><input type="checkbox" data-material="alufolie"> Alufolie</label>
<label><input type="checkbox" data-material="trinkhalm"> Trinkhalm</label>
<label><input type="checkbox" data-material="zahnstocher"> Zahnstocher</label>
<label><input type="checkbox" data-material="knete"> Knete / Teig</label>

<label><input type="checkbox" data-material="domino"> Domino</label>
<label><input type="checkbox" data-material="karten"> Spielkarten</label>
<label><input type="checkbox" data-material="seil"> Seil / Schnur</label>
<label><input type="checkbox" data-material="ballon"> Luftballon</label>

<label><input type="checkbox" data-material="muenzen"> Münzen</label>
<label><input type="checkbox" data-material="flaschen"> Flaschen / Plastikflaschen</label>
<label><input type="checkbox" data-material="glas"> Glas</label>

<label><input type="checkbox" data-material="zitrone"> Zitrone</label>
<label><input type="checkbox" data-material="salz"> Salz</label>
<label><input type="checkbox" data-material="zucker"> Zucker</label>
<label><input type="checkbox" data-material="natron"> Natron</label>
<label><input type="checkbox" data-material="essig"> Essig</label>
<label><input type="checkbox" data-material="oel"> Öl</label>

<label><input type="checkbox" data-material="eis"> Eiswürfel / Eis</label>
<label><input type="checkbox" data-material="lebensmittelfarbe"> Lebensmittelfarbe</label>
<label><input type="checkbox" data-material="lebensmittel"> Lebensmittel</label>

<label><input type="checkbox" data-material="nudeln"> Nudeln / Spaghetti</label>
<label><input type="checkbox" data-material="reis"> Reis</label>
<label><input type="checkbox" data-material="griess"> Grieß</label>
<label><input type="checkbox" data-material="bohnen"> Bohnen</label>

<label><input type="checkbox" data-material="magnete"> Magnete</label>
<label><input type="checkbox" data-material="licht"> Licht / Lampe</label>
<label><input type="checkbox" data-material="feuchttuchdeckel"> Feuchttuchdeckel</label>
<label><input type="checkbox" data-material="korken"> Korken</label>
<label><input type="checkbox" data-material="eierkarton"> Eierkarton</label>

  <h2>Zeit</h2>
  <div>
    <button data-time="3-5">3–5 Min</button>
    <button data-time="10">10 Min</button>
    <button data-time="20+">20+ Min</button>
  </div>

  <br>
  <button id="get-game-btn">Gib mir ein Spiel</button>

  <div id="game-card" style="margin-top:20px;">
    <h3 id="game-title"></h3>
    <p id="game-ages"></p>
    <p id="game-times"></p>
    <p id="game-materials"></p>

    <ul id="game-instructions"></ul>

    <p id="game-benefits"></p>

    <button id="next-game-btn">Andere Spielidee</button>
  </div>

</main>

<script src="games.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>

</body>
</html>
