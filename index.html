<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kinderförderung</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      width: 350px;
      text-align: center;
    }

    h1 {
      color: #d47b1f;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 12px;
      color: gray;
      margin-bottom: 25px;
    }

    .section {
      margin-bottom: 20px;
      text-align: left;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 15px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
    }

    .btn.active {
      border: 2px solid #d47b1f;
      background: #fff5ea;
    }

    .main-btn {
      margin-top: 20px;
      width: 100%;
      padding: 15px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(45deg, #d47b1f, #e6a72c);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>🧸 Kinderförderung</h1>
  <div class="subtitle">5 Minuten · Ohne Bildschirm · Einfache Spiele</div>

  <div class="section">
    <strong>Wie alt ist dein Kind?</strong>
    <div class="buttons">
      <button class="btn">1–2</button>
      <button class="btn active">3–4</button>
      <button class="btn">5–6</button>
      <button class="btn">7+</button>
    </div>
  </div>

  <div class="section">
    <strong>Wie viel Zeit habt ihr?</strong>
    <div class="buttons">
      <button class="btn active">3–5 Min</button>
      <button class="btn">10 Min</button>
      <button class="btn">20+ Min</button>
    </div>
  </div>

  <button class="main-btn">Gib mir eine Spielidee 🎲</button>

</div>

</body>
</html>
