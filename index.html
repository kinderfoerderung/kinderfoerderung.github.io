<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinderförderung</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="app">

  <h1>Kinderförderung</h1>

  <h2>Alter</h2>
  <div>
    <button data-age="1-2">1–2</button>
    <button data-age="3-4">3–4</button>
    <button data-age="5-6">5–6</button>
    <button data-age="7+">7+</button>
  </div>

  <h2>Material</h2>
  <div>
    <label><input type="checkbox" data-material="none" checked> Nichts</label>
    <label><input type="checkbox" data-material="papier"> Papier</label>
    <label><input type="checkbox" data-material="wasser"> Wasser</label>
    <label><input type="checkbox" data-material="becher"> Becher</label>
  </div>

  <h2>Zeit</h2>
  <div>
    <button data-time="3-5">3–5 Min</button>
    <button data-time="10">10 Min</button>
    <button data-time="20+">20+ Min</button>
  </div>

  <br>
  <button id="get-game-btn">Gib mir ein Spiel</button>

  <div id="game-card" style="margin-top:20px;">
    <h3 id="game-title"></h3>
    <p id="game-ages"></p>
    <p id="game-times"></p>
    <p id="game-materials"></p>

    <ul id="game-instructions"></ul>

    <p id="game-benefits"></p>

    <button id="next-game-btn">Andere Spielidee</button>
  </div>

</main>

<script src="games.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>

</body>
</html>
