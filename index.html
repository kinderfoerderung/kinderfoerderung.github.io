  <h2>Zeit</h2>
  <div class="time-grid">
    <button data-time="3-5">3–5 Min</button>

  <br>
  <button id="get-game-btn">Gib mir ein Spiel</button>

  <div id="game-card" style="margin-top:20px;">

  </div>

<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (!token) {
    document.body.innerHTML = "<h2 style='text-align:center;margin-top:40px;'>❌ Kein Zugriff</h2>";
    return;
  }

  try {
    const res = await fetch("http://46.225.191.69:8000/access/" + token);
    const data = await res.json();

    if (!data.access) {
      document.body.innerHTML = "<h2 style='text-align:center;margin-top:40px;'>❌ Zugriff abgelaufen</h2>";
      return;
    }
  } catch (e) {
    document.body.innerHTML = "<h2 style='text-align:center;margin-top:40px;'>⚠️ Fehler</h2>";
  }
})();
</script>

</body>
