<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinderförderung</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="app">

  <header class="hero">
    <div class="logo-wrap">
      <img src="logo.png" alt="Kinderförderung Logo" class="app-logo" />
    </div>
    <p class="hero-subline">5 Minuten · Alltagsmaterial · Ohne Bildschirm</p>
  </header>

 <h2>Alter des Kindes</h2>

<div class="age-grid">

  <button class="age-card" data-age="1-2">
    <img src="age1.png" alt="">
    <span>1–2</span>
  </button>

  <button class="age-card" data-age="3-4">
    <img src="age2.png" alt="">
    <span>3–4</span>
  </button>

  <button class="age-card" data-age="5-6">
    <img src="age3.png" alt="">
    <span>5–6</span>
  </button>

  <button class="age-card" data-age="7+">
    <img src="age4.png" alt="">
    <span>7+</span>
  </button>

</div>

  <h2>Material</h2>
  <div>
    <label><input type="checkbox" data-material="none" checked> Nichts</label>
    <label><input type="checkbox" data-material="papier"> Papier</label>
    <label><input type="checkbox" data-material="wasser"> Wasser</label>
    <label><input type="checkbox" data-material="becher"> Becher</label>
  </div>

  <h2>Zeit</h2>
  <div>
    <button data-time="3-5">3–5 Min</button>
    <button data-time="10">10 Min</button>
    <button data-time="20+">20+ Min</button>
  </div>

  <br>
  <button id="get-game-btn">Gib mir ein Spiel</button>

  <div id="game-card" style="margin-top:20px;">
    <h3 id="game-title"></h3>
    <p id="game-ages"></p>
    <p id="game-times"></p>
    <p id="game-materials"></p>

    <ul id="game-instructions"></ul>

    <p id="game-benefits"></p>

    <button id="next-game-btn">Andere Spielidee</button>
  </div>

</main>

<script src="games.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>

</body>
</html>
