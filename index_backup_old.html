<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinderförderung</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f1ee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      padding: 28px;
    }

    .logo {
      text-align: center;
      margin-bottom: 8px;
    }

    .logo img {
      max-width: 220px;
      width: 100%;
      height: auto;
    }

    .subtitle {
      text-align: center;
      color: #8e8e8e;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 14px 0;
      color: #2f2f2f;
    }

    .section {
      margin-bottom: 28px;
    }

    .age-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .age-box {
      border: 2px solid #ececec;
      border-radius: 18px;
      padding: 10px 8px;
      text-align: center;
      background: #fff;
      cursor: pointer;
      transition: 0.2s;
    }

    .age-box.active {
      border-color: #f0a12a;
      background: #fff6ea;
    }

    .age-box img {
      width: 100%;
      height: 56px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .age-label {
      font-size: 16px;
      font-weight: 700;
      color: #444;
    }

    .select-box {
      width: 100%;
      border: 2px solid #ececec;
      border-radius: 18px;
      padding: 16px;
      font-size: 16px;
      color: #666;
      background: white;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .time-box {
      border: 2px solid #ececec;
      border-radius: 18px;
      padding: 14px 10px;
      text-align: center;
      background: #fff;
      font-weight: 700;
      color: #444;
      cursor: pointer;
    }

    .time-box.active {
      border-color: #f0a12a;
      background: #fff6ea;
    }

    .main-button {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 18px;
      font-size: 18px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      background: linear-gradient(90deg, #f0ad2c, #1f7ae8, #39b54a);
      box-shadow: 0 12px 30px rgba(31, 122, 232, 0.18);
    }

    @media (max-width: 520px) {
      .age-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .time-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="logo.png" alt="Kinderförderung Logo">
    </div>

    <div class="subtitle">
      5 Minuten · Alltagsmaterial · Ohne Bildschirm
    </div>

    <div class="section">
      <h2>Wie alt ist dein Kind?</h2>
      <div class="age-grid">
        <div class="age-box">
          <img src="age1.png" alt="1–2 Jahre">
          <div class="age-label">1–2</div>
        </div>
        <div class="age-box active">
          <img src="age2.png" alt="3–4 Jahre">
          <div class="age-label">3–4</div>
        </div>
        <div class="age-box">
          <img src="age3.png" alt="5–6 Jahre">
          <div class="age-label">5–6</div>
        </div>
        <div class="age-box">
          <img src="age4.png" alt="7+ Jahre">
          <div class="age-label">7+</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Was ist gerade da?</h2>
      <select class="select-box">
        <option>Material auswählen...</option>
        <option>Papier</option>
        <option>Stifte</option>
        <option>Schere</option>
        <option>Kleber</option>
        <option>Becher</option>
        <option>Knöpfe</option>
      </select>
    </div>

    <div class="section">
      <h2>Wie viel Zeit habt ihr?</h2>
      <div class="time-grid">
        <div class="time-box active">3–5 Min</div>
        <div class="time-box">10 Min</div>
        <div class="time-box">20+ Min</div>
      </div>
    </div>

    <button class="main-button">Gib mir ein Spiel! 🎲</button>
  </div>
</body>
</html>
